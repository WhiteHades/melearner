[package]
name = "melearner-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
publish = false

[features]
default = []
abi-test-hooks = []

[lib]
name = "melearner_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
fff-query-parser = "=0.9.7-nightly.fce72fa"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
html5ever = "=0.39.0"
icu_collator = "=2.2.1"
jwalk = "=0.8.1"
libc = "=0.2.186"
libmpv2 = "=6.0.0"
libmpv2-sys = "=4.0.1"
markup5ever_rcdom = "=0.39.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
pulldown-cmark-to-cmark = "=22.0.0"
quick-xml = "=0.41.0"
seahash = "=4.1.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.52.3", features = ["rt"] }
zip = { version = "=8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
cbindgen = "=0.29.4"
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
