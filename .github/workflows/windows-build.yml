name: manual Windows C++ build

on:
  workflow_dispatch:
    inputs:
      run_playback:
        description: Run the existing native video playback checks
        type: boolean
        required: false
        default: false
      package:
        description: Build and retain a diagnostic Windows installer and its notices
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: manual-cpp-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and core workflow
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VCPKG_ROOT: D:\v
      VCPKG_DEFAULT_BINARY_CACHE: D:\vcache\archives
      VCPKG_MAX_CONCURRENCY: 2
      MELEARNER_QT_ROOT: D:\qt\6.11.2\msvc2022_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: prepare the native playback display
        if: inputs.run_playback
        timeout-minutes: 1
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PlaybackDisplay {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            private struct Mode {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string DeviceName;
              public ushort SpecVersion, DriverVersion, Size, DriverExtra;
              public uint Fields;
              public int PositionX, PositionY;
              public uint DisplayOrientation, DisplayFixedOutput;
              public short Color, Duplex, YResolution, TTOption, Collate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string FormName;
              public ushort LogPixels;
              public uint BitsPerPel, PelsWidth, PelsHeight, DisplayFlags, DisplayFrequency;
              public uint ICMMethod, ICMIntent, MediaType, DitherType, Reserved1, Reserved2;
              public uint PanningWidth, PanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            [return: MarshalAs(UnmanagedType.Bool)]
            private static extern bool EnumDisplaySettings(string device, int index, ref Mode mode);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            private static extern int ChangeDisplaySettings(ref Mode mode, uint flags);
            private static Mode Current() {
              var mode = new Mode { Size = (ushort)Marshal.SizeOf<Mode>(), DeviceName = "", FormName = "" };
              if (!EnumDisplaySettings(null, -1, ref mode)) throw new Exception("Cannot read the runner display mode");
              return mode;
            }
            public static void Prepare() {
              var mode = Current();
              Console.WriteLine("Runner display before playback: {0}x{1}", mode.PelsWidth, mode.PelsHeight);
              if (mode.PelsWidth < 1920 || mode.PelsHeight < 1080) {
                mode.Fields = 0x00080000 | 0x00100000; // DM_PELSWIDTH | DM_PELSHEIGHT
                mode.PelsWidth = 1920;
                mode.PelsHeight = 1080;
                int result = ChangeDisplaySettings(ref mode, 2); // CDS_TEST, no registry changes
                if (result != 0) throw new Exception("Runner cannot provide the wide playback display; mode test returned " + result);
                result = ChangeDisplaySettings(ref mode, 0);
                if (result != 0) throw new Exception("Runner display change failed with code " + result);
              }
              mode = Current();
              Console.WriteLine("Runner display after playback setup: {0}x{1}", mode.PelsWidth, mode.PelsHeight);
              if (mode.PelsWidth < 1920 || mode.PelsHeight < 1080)
                throw new Exception("Runner did not apply the required playback display mode");
            }
          }
          '@
          [PlaybackDisplay]::Prepare()
          Add-Type -AssemblyName System.Windows.Forms
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          Write-Host "Playback desktop working area: $area"
          if ($area.Width -lt 1920 -or $area.Height -lt 1000) {
            throw 'Runner desktop cannot fit the existing wide playback checks'
          }
      - name: install pinned CMake
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          $archive = Join-Path $env:RUNNER_TEMP 'cmake.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'melearner-tools'
          Invoke-WebRequest 'https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip' -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne 'bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536') {
            throw 'CMake archive SHA-256 mismatch'
          }
          Expand-Archive $archive -DestinationPath $tools
          $bin = Join-Path $tools 'cmake-4.4.4-windows-x86_64\bin'
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "MELEARNER_CMAKE=$bin\cmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MELEARNER_CTEST=$bin\ctest.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$bin\cmake.exe" --version
      - name: restore official Qt SDK archives
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\qcache
          key: windows-msvc2022-qt-6.11.2-20260813-v1
      - name: install the pinned official Qt SDK
        shell: pwsh
        run: |
          $desktop = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64'
          $extensions = 'https://download.qt.io/online/qtsdkrepository/windows_x86/extensions'
          $suffix = '-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z'
          $archives = @(
            @{ Root = "$desktop/qt.qt6.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; Module = 'qtbase'; Sha256 = 'fd984b7264361b4dd3fd2a417702ca1258e4086268f2ee6a69b9a393d9c3f6bb' },
            @{ Root = "$desktop/qt.qt6.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; Module = 'qtdeclarative'; Sha256 = '5591ca564c1a9299a45a15b6b1d324c86e0aaed7cf6c47b7e6fe464aecae2587' },
            @{ Root = "$desktop/qt.qt6.6112.addons.qtwebchannel.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; Module = 'qtwebchannel'; Sha256 = 'eb99ba81ea6fc245765d9c1f0d278edeff596fab91cadf8cf43f8fb958a7ca40' },
            @{ Root = "$desktop/qt.qt6.6112.addons.qtpositioning.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; Module = 'qtpositioning'; Sha256 = 'ad22601482896fb3551e62b1609f0c8397ed33e5c540e0bb2e93bb1ec3a43873' },
            @{ Root = "$desktop/qt.qt6.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; File = 'd3dcompiler_47-x64.7z'; Subdir = 'bin'; Sha256 = 'b1c379f739fa59a495a388c0878757e3d90fb72e0df771237a1ee4a2c1675d15' },
            @{ Root = "$desktop/qt.qt6.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; File = 'opengl32sw-64-mesa_11_2_2-signed_sha256.7z'; Subdir = 'bin'; Sha256 = '59a086716cfd4bdec035698d501ba45526f8d2ecb5c0c428a356d8be0b5d2c79' },
            @{ Root = "$extensions/qtpdf/6112/msvc2022_64/extensions.qtpdf.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131017'; Module = 'qtpdf'; Sha256 = '83306fe90cdbb2a365bdea1188be9352772ad8f1aea94ef327758f1635c86908' },
            @{ Root = "$extensions/qtwebengine/6112/msvc2022_64/extensions.qtwebengine.6112.win64_msvc2022_64"; Version = '6.11.2-0-202608131118'; Module = 'qtwebengine'; Sha256 = '689791f9af21e35bf72fe494b428ba38699a974f868cde6424a0442a465db94c' }
          )
          New-Item -ItemType Directory -Force 'D:\qcache', $env:MELEARNER_QT_ROOT | Out-Null
          $sevenZip = Get-Command 7z.exe -ErrorAction Stop
          foreach ($archive in $archives) {
            $name = if ($archive.File) { "$($archive.Version)$($archive.File)" } else { "$($archive.Version)$($archive.Module)$suffix" }
            $file = Join-Path 'D:\qcache' $name
            if (-not (Test-Path $file)) { Invoke-WebRequest "$($archive.Root)/$name" -OutFile $file }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($hash -ne $archive.Sha256) { throw "Qt SDK SHA-256 mismatch: $name" }
            $destination = if ($archive.Subdir) { Join-Path $env:MELEARNER_QT_ROOT $archive.Subdir } else { $env:MELEARNER_QT_ROOT }
            & $sevenZip.Source x $file "-o$destination" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "Qt SDK extraction failed: $name" }
          }
          @'
          [Paths]
          Prefix=..
          '@ | Set-Content -Encoding ascii (Join-Path $env:MELEARNER_QT_ROOT 'bin\qt.conf')
          $version = & "$env:MELEARNER_QT_ROOT\bin\qtpaths.exe" --query QT_VERSION
          if ($LASTEXITCODE -ne 0 -or $version -ne '6.11.2') { throw 'Qt SDK path/version validation failed' }
          $bytes = (Get-ChildItem 'D:\qcache' -File | Measure-Object -Property Length -Sum).Sum
          if ($bytes -gt 1073741824) { throw 'Qt SDK archive cache exceeds the 1 GiB budget' }
      - name: save official Qt SDK archives
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\qcache
          key: windows-msvc2022-qt-6.11.2-20260813-v1
      - name: restore vcpkg binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\vcache\archives
          key: windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v6
          restore-keys: |
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v6-partial-
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v5
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v5-partial-
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v4
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v4-partial-
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v3
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v3-partial-
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v2-partial-
            windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-v1
      - name: bootstrap pinned vcpkg and install dependencies
        id: dependencies
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git D:\v
          git -C D:\v checkout 3cbc1db4d867ec83c89fba4c461321c11f78b5e3
          $tripletDir = 'D:\vcache\triplets'
          New-Item -ItemType Directory -Force $tripletDir | Out-Null
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          "@ | Set-Content -Encoding ascii (Join-Path $tripletDir 'x64-windows-release.cmake')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & D:\v\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & D:\v\vcpkg.exe install 'sqlite3[fts5]' libzip md4c 'ffmpeg[core,avcodec,avformat,avfilter,swscale,swresample]' libass vulkan-loader pkgconf `
            --triplet x64-windows-release --host-triplet x64-windows-release --overlay-triplets=$tripletDir `
            --clean-buildtrees-after-build --clean-packages-after-build
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed' }
      - name: measure binary archive cache size
        if: ${{ !cancelled() && steps.dependencies.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        id: cache-budget
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem D:\vcache\archives -File -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $bytes) { $bytes = 0 }
          Write-Host "Compressed vcpkg archive cache size: $bytes bytes"
          if ($bytes -gt 0 -and $bytes -le 4294967296) {
            "cacheable=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host 'Skipping empty cache or compressed archives exceeding 4 GiB.'
            "cacheable=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: save vcpkg binary archives
        if: ${{ !cancelled() && steps.cache-budget.outputs.cacheable == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\vcache\archives
          key: windows-2025-x64-release-vcpkg-3cbc1db4d867ec83c89fba4c461321c11f78b5e3-${{ steps.dependencies.outcome == 'success' && 'v6' || format('v6-partial-{0}', github.run_id) }}
      - name: install pinned Meson build tools
        shell: pwsh
        run: |
          py -3 -m pip install --disable-pip-version-check meson==1.9.1 ninja==1.13.0
          py -3 -m mesonbuild.mesonmain --version
          ninja --version
      - name: build the pinned mpv source SDK
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & pwsh -NoProfile -File scripts/build-cpp-windows-mpv.ps1 `
            -VcpkgInstalled D:\v\installed\x64-windows-release -OutputDir D:\v\mpv-sdk
          if ($LASTEXITCODE -ne 0) { throw 'Pinned mpv source build failed' }
      - name: build and run the core workflow test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_LOGGING_RULES: qt.qpa.plugin.debug=true
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $vcpkgInstalled = 'D:\v\installed\x64-windows-release'
          $pkgconf = Join-Path $vcpkgInstalled 'tools\pkgconf\pkgconf.exe'
          if (-not (Test-Path $pkgconf)) { throw "pkgconf not found at $pkgconf" }
          $env:PKG_CONFIG_PATH = "$env:MPV_SDK\lib\pkgconfig;$vcpkgInstalled\lib\pkgconfig;$vcpkgInstalled\share\pkgconfig"
          $env:Path = "$env:MELEARNER_QT_ROOT\bin;$env:MPV_SDK\bin;$vcpkgInstalled\bin;$env:Path"
          & $pkgconf --exists mpv libzip md4c md4c-html libavformat libavcodec libavutil libswscale
          if ($LASTEXITCODE -ne 0) { throw 'pkgconf dependency validation failed' }
          & $env:MELEARNER_CMAKE -S . -B build\manual-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
            -DCMAKE_PREFIX_PATH="$env:MELEARNER_QT_ROOT" `
            -DCMAKE_TOOLCHAIN_FILE=D:\v\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release `
            -DVCPKG_OVERLAY_TRIPLETS=D:\vcache\triplets `
            -DPKG_CONFIG_EXECUTABLE="$pkgconf"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          & $env:MELEARNER_CMAKE --build build\manual-windows --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          $appExe = (Resolve-Path 'build\manual-windows\melearner.exe').Path
          $headers = & dumpbin /nologo /headers $appExe
          if ($LASTEXITCODE -ne 0 -or -not ($headers -match '^\s+2 subsystem \(Windows GUI\)\s*$')) {
            throw 'melearner.exe must use the Windows GUI subsystem, not open a console window'
          }
          Write-Host 'melearner.exe uses the Windows GUI subsystem'
          $testExe = (Resolve-Path 'build\manual-windows\main_window_test.exe').Path
          $windeployqt = Join-Path $env:MELEARNER_QT_ROOT 'bin\windeployqt.exe'
          if (-not (Test-Path $windeployqt)) { throw 'windeployqt.exe not found in the official Qt SDK' }
          & $windeployqt --release --compiler-runtime --webenginewidgets --skip-plugin-types position $testExe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed for core workflow test' }
          $platformPlugin = Join-Path (Split-Path $testExe) 'platforms\qwindows.dll'
          if (-not (Test-Path $platformPlugin)) { throw 'Windows platform plugin was not deployed' }
          Copy-Item $env:MPV_DLL (Split-Path $testExe) -Force
          $vulkanLoader = Join-Path $vcpkgInstalled 'bin\vulkan-1.dll'
          if (-not (Test-Path $vulkanLoader)) { throw 'Pinned mpv SDK requires vulkan-1.dll' }
          Copy-Item $vulkanLoader (Split-Path $testExe) -Force
          # Copy only the indexed dependency closure needed by the app, tests,
          # and already staged DLLs. Prefer files already deployed beside the
          # test, then Qt, vcpkg, mpv SDK, and finally Windows system DLLs.
          $testDirectory = (Resolve-Path (Split-Path $testExe)).Path
          $system32 = Join-Path $env:SystemRoot 'System32'
          $runtimeRoots = @(
            $testDirectory, (Join-Path $env:MELEARNER_QT_ROOT 'bin'),
            (Join-Path $vcpkgInstalled 'bin'), (Split-Path $env:MPV_DLL), $system32
          )
          $runtimeFiles = [Collections.Generic.Dictionary[string,string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($root in $runtimeRoots) {
            if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw "Runtime DLL search directory is missing: $root" }
            $files = if ($root -eq $system32) {
              Get-ChildItem -LiteralPath $root -File -Filter '*.dll'
            } else {
              Get-ChildItem -LiteralPath $root -File -Filter '*.dll' -Recurse
            }
            foreach ($file in $files) {
              if (-not $runtimeFiles.ContainsKey($file.Name)) { $runtimeFiles.Add($file.Name, $file.FullName) }
            }
          }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $pending = [Collections.Generic.Queue[string]]::new()
          @(Get-Item $appExe, $testExe, 'build\manual-windows\main_playback_test.exe') |
            ForEach-Object { $pending.Enqueue($_.FullName) }
          Get-ChildItem -LiteralPath $testDirectory -Filter '*.dll' -File -Recurse |
            ForEach-Object { $pending.Enqueue($_.FullName) }
          while ($pending.Count -gt 0) {
            $binary = $pending.Dequeue()
            if (-not $seen.Add($binary)) { continue }
            $imports = & dumpbin /nologo /dependents $binary
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect DLL imports: $([IO.Path]::GetFileName($binary))" }
            foreach ($line in $imports) {
              if ($line -notmatch '^\s+([\w.-]+\.dll)\s*$') { continue }
              $dependency = $Matches[1]
              # Windows API sets are virtual DLL names resolved by the OS.
              if ($dependency -match '^(api|ext)-ms-') { continue }
              $resolved = $null
              [void]$runtimeFiles.TryGetValue($dependency, [ref]$resolved)
              if (-not $resolved) { throw "Unresolved runtime import: $([IO.Path]::GetFileName($binary)) -> $dependency" }
              if ([string]::Equals((Split-Path $resolved -Parent), $system32, [StringComparison]::OrdinalIgnoreCase)) { continue }
              if (-not [string]::Equals((Split-Path $resolved -Parent), $testDirectory, [StringComparison]::OrdinalIgnoreCase)) {
                $destination = Join-Path $testDirectory $dependency
                if (-not (Test-Path -LiteralPath $destination)) { Copy-Item -LiteralPath $resolved -Destination $destination }
                $runtimeFiles[$dependency] = $destination
                $resolved = $destination
              }
              $pending.Enqueue($resolved)
            }
          }
          $env:Path = "$(Split-Path $testExe);$env:Path"
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class StartupErrors {
            [DllImport("kernel32.dll")]
            public static extern uint SetErrorMode(uint mode);
          }
          '@
          # Child processes inherit this mode. Missing DLLs and crashes must
          # return errors, not wait in an unseen Windows system message box.
          [void][StartupErrors]::SetErrorMode(0x8003)
          $loadJob = Start-Job -ArgumentList (Split-Path $testExe) -ScriptBlock {
            param($directory)
            foreach ($name in @('Qt6Core.dll', 'libmpv-2.dll', 'Qt6WebEngineWidgets.dll')) {
              Write-Output "Checking native DLL load: $name"
              $handle = [System.Runtime.InteropServices.NativeLibrary]::Load((Join-Path $directory $name))
              [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
              Write-Output "Native DLL loaded successfully: $name"
            }
          }
          try {
            $loadJob | Wait-Job -Timeout 20 | Out-Null
            Receive-Job $loadJob -ErrorAction Stop
            if ($loadJob.State -ne 'Completed') { throw 'Native DLL load probe did not finish within 20 seconds' }
          } finally {
            if ($loadJob.State -eq 'Running') { Stop-Job $loadJob }
            Remove-Job $loadJob -Force
          }
          & $env:MELEARNER_CTEST --test-dir build\manual-windows --verbose --output-on-failure -R '^core_workflow$'
          if ($LASTEXITCODE -ne 0) { throw 'core workflow test failed' }
      - name: run the existing native playback checks
        if: inputs.run_playback
        timeout-minutes: 4
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_OPENGL: software
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $testExe = (Resolve-Path 'build\manual-windows\main_playback_test.exe').Path
          $directory = Split-Path $testExe
          $env:Path = "$directory;$env:MELEARNER_QT_ROOT\bin;D:\v\installed\x64-windows-release\bin;$env:Path"
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class PlaybackErrors {
            [DllImport("kernel32.dll")]
            public static extern uint SetErrorMode(uint mode);
          }
          '@
          [void][PlaybackErrors]::SetErrorMode(0x8003)
          $stdout = Join-Path $env:RUNNER_TEMP 'playback.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'playback.stderr.log'
          $process = Start-Process $testExe -ArgumentList 'playsPausesAndRestoresPosition', '-v1' `
            -WorkingDirectory $directory -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            if (-not $process.WaitForExit(180000)) {
              & taskkill.exe /PID $process.Id /T /F
              throw 'Native playback checks exceeded 180 seconds'
            }
            if ($process.ExitCode -ne 0) { throw "Native playback checks failed with exit code $($process.ExitCode)" }
          } finally {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            $process.Dispose()
          }
      - name: collect Windows runtime notices and build the installer
        if: inputs.package
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Inno Setup 6 ISCC.exe is not installed on this runner' }
          $mpvBin = Split-Path $env:MPV_DLL
          $env:Path = "$(Split-Path $iscc);$env:MELEARNER_QT_ROOT\bin;$mpvBin;D:\v\installed\x64-windows-release\bin;$env:Path"
          & pwsh -NoProfile -File scripts/collect-cpp-windows-notices.ps1 `
            -BuildDir build/manual-windows -VcpkgRoot D:\v -MpvSdk D:\v\mpv-sdk `
            -MpvArchive $env:MPV_SOURCE_ARCHIVE -QtRoot $env:MELEARNER_QT_ROOT `
            -OutputDir .tmp/manual-ci/windows-legal
          if ($LASTEXITCODE -ne 0) { throw 'Windows legal notices collection failed' }
          $versionMatch = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(melearner VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $versionMatch.Success) { throw 'Could not determine the installer version' }
          $installer = "dist/melearner-$($versionMatch.Groups[1].Value)-setup.exe"
          & pwsh -NoProfile -File scripts/package-cpp-windows.ps1 `
            -BuildDir build/manual-windows -QtRoot $env:MELEARNER_QT_ROOT `
            -VcpkgBin D:\v\installed\x64-windows-release\bin -MpvBin $mpvBin `
            -LegalRoot .tmp/manual-ci/windows-legal -Version $versionMatch.Groups[1].Value -Output $installer
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          $installerPath = (Resolve-Path $installer).Path
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installerPath -Leaf)" | Set-Content -Encoding ascii "${installerPath}.sha256"
      - name: upload diagnostic Windows installer and evidence
        if: ${{ always() && inputs.package }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: melearner-windows-diagnostic-installer
          path: |
            dist/melearner-*-setup.exe
            dist/melearner-*-setup.exe.sha256
            .tmp/manual-ci/windows-legal
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
