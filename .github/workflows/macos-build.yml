name: c++ macOS

on:
  workflow_dispatch:
    inputs:
      package:
        description: Create and upload a diagnostic arm64 DMG
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cpp-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt application build and core workflow
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: macos-15-${{ runner.arch }}-homebrew-downloads-v1

      - name: install build dependencies
        run: |
          brew install cmake ninja pkgconf qtbase qttools qtwebengine qtsvg \
            sqlite mpv libzip md4c ffmpeg

      - name: measure download cache
        id: cache-budget
        if: steps.brew-cache.outputs.cache-hit != 'true'
        run: |
          bytes=$(du -sk "$HOME/Library/Caches/Homebrew/downloads" | awk '{print $1 * 1024}')
          if [ "$bytes" -le 2147483648 ]; then
            echo 'cacheable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: save Homebrew downloads
        if: steps.cache-budget.outputs.cacheable == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: macos-15-${{ runner.arch }}-homebrew-downloads-v1

      - name: build and run core workflow
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUILD_TESTING=ON
          cmake --build build/macos --parallel 3
          ctest --test-dir build/macos --output-on-failure -R '^core_workflow$'

      - name: Package diagnostic DMG
        if: inputs.package
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix qtbase)/bin:$(brew --prefix qttools)/bin:$PATH"
          scripts/package-cpp-macos.sh

      - name: Upload diagnostic DMG
        if: inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: melearner-0.1.9-macos-arm64-diagnostic
          path: dist/melearner-0.1.9-macos-arm64.dmg*
          if-no-files-found: error
          retention-days: 3
