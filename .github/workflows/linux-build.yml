name: Linux build

on:
  workflow_dispatch:
    inputs:
      package:
        description: Build and retain a diagnostic AppImage (unsigned; not release-qualified)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        run: |
          brew_prefix=/home/linuxbrew/.linuxbrew
          test -x "$brew_prefix/bin/brew"
          echo "$brew_prefix/bin" >> "$GITHUB_PATH"
          echo "$brew_prefix/sbin" >> "$GITHUB_PATH"
          "$brew_prefix/bin/brew" --version

      - name: Cache Homebrew downloads
        id: homebrew-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/Homebrew/downloads
          key: linux-homebrew-qtwebengine-6.11.2-b1da138e3f32273bbce7d1c9872b1014921beb16fab49e3c9bdd269f71db0a3f-v1

      - name: Verify pinned Qt WebEngine bottle
        run: |
          brew info --json=v2 qtwebengine | jq --exit-status \
            --arg version '6.11.2' \
            --arg sha 'b1da138e3f32273bbce7d1c9872b1014921beb16fab49e3c9bdd269f71db0a3f' \
            'any(.formulae[]; .versions.stable == $version and .bottle.stable.files.x86_64_linux.sha256 == $sha)'

      - name: Install build dependencies
        run: |
          brew install --force-bottle \
            qtwebengine qtimageformats gcc cmake meson ninja pkgconf \
            libzip md4c ffmpeg libplacebo libass luajit sqlite \
            libva libvdpau libdrm pipewire pulseaudio alsa-lib wayland mesa \
            libx11 libxrandr libxpresent libxfixes libxv libxext \
            libxcomposite libxdamage libxrender libxkbcommon libxcb \
            xorgproto libxcursor libxi libxshmfence libxscrnsaver
          sudo apt-get update
          # The PDF accessibility fixture writes Japanese text with QPdfWriter.
          # Missing source glyphs produce a broken fixture, not an unreadable PDF.
          sudo apt-get install --no-install-recommends -y libffmpeg-nvenc-dev libdisplay-info-dev fonts-noto-cjk

      - name: Install AppImage tooling
        if: inputs.package == true
        run: |
          brew install patchelf
          patchelf_version="$(patchelf --version | awk '{print $2}')"
          test "$(printf '%s\n' 0.19.1 "$patchelf_version" | sort -V | head -n1)" = 0.19.1
          plugin_url='https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage'
          curl --fail --location --silent --show-error "$plugin_url" -o "$RUNNER_TEMP/linuxdeploy-plugin-appimage"
          echo '992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3  '"$RUNNER_TEMP/linuxdeploy-plugin-appimage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/linuxdeploy-plugin-appimage"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check Homebrew download cache size
        id: downloads-size
        run: |
          size_bytes="$(du -sb "$HOME/.cache/Homebrew/downloads" | cut -f1)"
          if (( size_bytes <= 2147483648 )); then
            echo 'within_limit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'within_limit=false' >> "$GITHUB_OUTPUT"
          fi
          if (( size_bytes > 2147483648 )); then
            echo "Homebrew downloads exceed the 2 GiB cache budget; skipping cache save."
          fi

      - name: Save Homebrew downloads cache
        if: steps.homebrew-cache.outputs.cache-hit != 'true' && steps.downloads-size.outputs.within_limit == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/Homebrew/downloads
          key: linux-homebrew-qtwebengine-6.11.2-b1da138e3f32273bbce7d1c9872b1014921beb16fab49e3c9bdd269f71db0a3f-v1

      - name: Configure
        run: |
          gcc_prefix="$(brew --prefix gcc)"
          gcc_major="$(brew info --json=v2 gcc | jq -r '.formulae[0].versions.stable | split(".")[0]')"
          export CC="$gcc_prefix/bin/gcc-$gcc_major"
          export CXX="$gcc_prefix/bin/g++-$gcc_major"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          pkgconfig_paths=
          for formula in \
            ffmpeg libplacebo libass libzip md4c luajit libva libvdpau libdrm \
            pipewire pulseaudio alsa-lib wayland mesa libx11 libxrandr \
            libxpresent libxfixes libxv libxext libxcomposite libxdamage \
            libxrender libxkbcommon libxcb xorgproto libxcursor libxi \
            libxshmfence libxscrnsaver; do
            formula_prefix="$(brew --prefix "$formula")"
            pkgconfig_paths="${pkgconfig_paths:+$pkgconfig_paths:}$formula_prefix/lib/pkgconfig:$formula_prefix/share/pkgconfig"
          done
          export PKG_CONFIG_PATH="$pkgconfig_paths:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          library_paths=
          while IFS= read -r formula; do
            formula_prefix="$(brew --prefix "$formula")"
            for libdir in lib lib64; do
              if [[ -d "$formula_prefix/$libdir" ]]; then
                library_paths="${library_paths:+$library_paths:}$formula_prefix/$libdir"
              fi
            done
          done < <(brew list --formula)
          gcc_libdir="$gcc_prefix/lib/gcc/$gcc_major"
          export LD_LIBRARY_PATH="$gcc_libdir:$library_paths${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix qtbase);$(brew --prefix qtwebengine);$(brew --prefix sqlite)"

      - name: Build
        run: cmake --build build/linux --parallel 3

      - name: Run core workflow test
        run: |
          test "$(build/linux/melearner --version)" = 'melearner-cpp-v1 0.1.2'
          ctest --test-dir build/linux --output-on-failure -R '^core_workflow$'
          QT_QPA_PLATFORM=offscreen build/linux/library_scan_test
          QT_QPA_PLATFORM=offscreen build/linux/update_workflow_test

      - name: Collect Linux package notice evidence
        if: inputs.package == true
        run: bash scripts/collect-cpp-linux-notices.sh --build-dir build/linux --output-dir .tmp/manual-ci

      - name: Build diagnostic AppImage
        if: inputs.package == true
        env:
          LINUXDEPLOY_PLUGIN_APPIMAGE: ${{ runner.temp }}/linuxdeploy-plugin-appimage
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          bash scripts/package-cpp-appimage.sh --build-dir build/linux --legal-root .tmp/manual-ci/legal --output .tmp/manual-ci/melearner_0.1.2_amd64.AppImage

      - name: Upload diagnostic output and notice evidence
        if: ${{ always() && inputs.package == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-diagnostic-${{ github.sha }}
          path: |
            .tmp/manual-ci/melearner_0.1.2_amd64.AppImage
            .tmp/manual-ci/legal/
            .tmp/manual-ci/notice-evidence/
            .tmp/manual-ci/packages.jsonl
            .tmp/manual-ci/evidence.jsonl
            .tmp/manual-ci/missing.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
