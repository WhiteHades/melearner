name: Draft release delivery

on:
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Retain installers for review without changing the public release
        type: boolean
        required: false
        default: false
      linux_run:
        description: Successful Linux build run ID with diagnostic package enabled
        type: string
        required: true
      windows_run:
        description: Successful Windows build run ID with diagnostic package enabled
        type: string
        required: true
      macos_run:
        description: Successful macOS build run ID with diagnostic package enabled
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-release-delivery
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Validate source runs and download their artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          MACOS_RUN: ${{ inputs.macos_run }}
        run: |
          set -euo pipefail
          for run_id in "$LINUX_RUN" "$WINDOWS_RUN" "$MACOS_RUN"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "run IDs must contain digits only" >&2; exit 1; }
          done
          mkdir -p .tmp/release-delivery/{linux,windows,macos,out}
          validate_run() {
            local id="$1" expected="$2" artifact="$3" destination="$4" metadata workflow_path head
            metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [[ "$(jq -r .repository.full_name <<<"$metadata")" == "$GITHUB_REPOSITORY" ]] || { echo "run $id belongs to another repository" >&2; return 1; }
            [[ "$(jq -r .status <<<"$metadata")" == completed && "$(jq -r .conclusion <<<"$metadata")" == success ]] || { echo "run $id is not successful and completed" >&2; return 1; }
            workflow="$(jq -r .workflow_id <<<"$metadata")"
            workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq .path)"
            [[ "$workflow_path" == "$expected" ]] || { echo "run $id uses unexpected workflow: $workflow_path" >&2; return 1; }
            head="$(jq -r .head_sha <<<"$metadata")"
            git fetch --no-tags origin "$head"
            gh run download "$id" --name "$artifact" --dir "$destination" >&2
            printf '%s\n' "$head"
          }
          linux_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LINUX_RUN}" --jq .head_sha)"
          linux_sha="$(validate_run "$LINUX_RUN" .github/workflows/linux-build.yml "linux-diagnostic-${linux_head}" .tmp/release-delivery/linux)"
          windows_sha="$(validate_run "$WINDOWS_RUN" .github/workflows/windows-build.yml melearner-windows-diagnostic-installer .tmp/release-delivery/windows)"
          macos_sha="$(validate_run "$MACOS_RUN" .github/workflows/macos-build.yml melearner-0.1.2-macos-arm64-diagnostic .tmp/release-delivery/macos)"
          windows_profile="$(find .tmp/release-delivery/windows -type f -name reference-profiles-v1.json -print -quit)"
          [[ -n "$windows_profile" ]] || { echo "Windows notice evidence is missing" >&2; exit 1; }
          jq '.missingEvidence' "$windows_profile"
          # Compare compiled inputs and each platform's installer inputs.
          # Test isolation fixes and prose edits do not change the shipped app.
          application_inputs=(cpp-app/src cpp-app/assets cpp-app/schema cpp-app/patches cpp-app/cmake cpp-app/tools cmake CMakeLists.txt LICENSE)
          for head in "$linux_sha" "$windows_sha" "$macos_sha"; do
            [[ "$(git ls-tree "$head" -- "${application_inputs[@]}")" == "$(git ls-tree "$GITHUB_SHA" -- "${application_inputs[@]}")" ]] || {
              echo "run commit $head has a different C++ application source tree" >&2; exit 1;
            }
          done
          validate_package_inputs() {
            local head="$1"; shift
            [[ "$(git ls-tree "$head" -- "$@")" == "$(git ls-tree "$GITHUB_SHA" -- "$@")" ]] || {
              echo "run commit $head has different platform packaging inputs" >&2; return 1;
            }
          }
          validate_package_inputs "$linux_sha" packaging/linux packaging/arch \
            scripts/package-cpp-appimage.sh scripts/stage-cpp-linux.cmake scripts/collect-cpp-linux-notices.sh .github/workflows/linux-build.yml
          validate_package_inputs "$windows_sha" packaging/windows \
            scripts/package-cpp-windows.ps1 scripts/build-cpp-windows-mpv.ps1 scripts/collect-cpp-windows-notices.ps1 .github/workflows/windows-build.yml
          validate_package_inputs "$macos_sha" scripts/package-cpp-macos.sh .github/workflows/macos-build.yml
          jq -n --arg linux "$linux_sha" --arg windows "$windows_sha" --arg macos "$macos_sha" \
            '{linux_head_sha:$linux,windows_head_sha:$windows,macos_head_sha:$macos}' \
            > .tmp/release-delivery/out/source-heads.json

      - name: Assemble release assets and package Arch from the validated AppImage tree
        run: |
          set -euo pipefail
          root=.tmp/release-delivery
          linux_file="$(find "$root/linux" -type f -name melearner_0.1.2_amd64.AppImage -print -quit)"
          windows_file="$(find "$root/windows" -type f -name melearner-0.1.2-setup.exe -print -quit)"
          macos_file="$(find "$root/macos" -type f -name melearner-0.1.2-macos-arm64.dmg -print -quit)"
          [[ -n "$linux_file" && -n "$windows_file" && -n "$macos_file" ]] || { echo "one or more expected platform assets were not found" >&2; exit 1; }
          windows_sum="$windows_file.sha256"
          macos_sum="$macos_file.sha256"
          for file in "$linux_file" "$windows_file" "$windows_sum" "$macos_file" "$macos_sum"; do
            [[ -s "$file" && ! -L "$file" ]] || { echo "expected artifact missing: $file" >&2; exit 1; }
          done
          (cd "$(dirname "$windows_file")" && sha256sum --check "$(basename "$windows_sum")")
          (cd "$(dirname "$macos_file")" && sha256sum --check "$(basename "$macos_sum")")

          out="$root/out"
          cp -- "$linux_file" "$out/"
          cp -- "$windows_file" "$out/"
          cp -- "$macos_file" "$out/"
          chmod +x "$out/$(basename "$linux_file")"
          (cd "$out" && sha256sum "$(basename "$linux_file")" > "$(basename "$linux_file").sha256")
          cp -- "$windows_sum" "$out/$(basename "$windows_file").sha256"
          cp -- "$macos_sum" "$out/$(basename "$macos_file").sha256"

          extract="$root/appimage"
          mkdir -p "$extract"
          (cd "$extract" && "$GITHUB_WORKSPACE/$out/$(basename "$linux_file")" --appimage-extract)
          stage="$extract/squashfs-root"
          [[ -d "$stage/usr" && ! -L "$stage/usr" ]] || { echo "AppImage extraction lacks a real usr tree" >&2; exit 1; }

          package_dir="$root/arch-package"
          mkdir -p "$package_dir"
          cp packaging/arch/PKGBUILD "$package_dir/PKGBUILD"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/$package_dir:/work/package" \
            -v "$GITHUB_WORKSPACE/$stage:/work/appdir:ro" \
            -e MELEARNER_CPP_STAGE=/work/appdir \
            archlinux:base-devel@sha256:8edb44f40a0cb5d3e44ef474f02780098ce0084e591c8641bdc01f02f185cc40 \
            bash -euc 'stat -c "%a %u %g %n" /work/appdir /work/appdir/usr; stage_uid=$(stat -c %u /work/appdir); test "$stage_uid" -gt 0; useradd --uid "$stage_uid" --create-home builder; chown -R builder:builder /work/package; su - builder -c "test -d /work/appdir/usr && cd /work/package && MELEARNER_CPP_STAGE=/work/appdir makepkg --nodeps --noconfirm"; bad_dir=$(find /work/package/pkg/melearner-bin/usr -type d ! -perm 755 -print -quit); test -z "$bad_dir"; bad_file=$(find /work/package/pkg/melearner-bin/usr -type f ! -perm -004 -print -quit); test -z "$bad_file"; test -x /work/package/pkg/melearner-bin/usr/bin/melearner'
          arch_pkg="$package_dir/melearner-bin-0.1.2-1-x86_64.pkg.tar.zst"
          [[ -s "$arch_pkg" && ! -L "$arch_pkg" ]] || { echo "makepkg did not produce expected Arch package" >&2; exit 1; }
          cp -- "$arch_pkg" "$out/"
          (cd "$out" && sha256sum melearner-bin-0.1.2-1-x86_64.pkg.tar.zst > melearner-bin-0.1.2-1-x86_64.pkg.tar.zst.sha256)

          sources="$(find "$root/windows" -type d -path '*/windows-legal/sources' -print -quit)"
          [[ -n "$sources" && -d "$sources" && ! -L "$sources" ]] || { echo "Windows artifact lacks source archive, patch, and manifest directory" >&2; exit 1; }
          legal_dir="$(dirname "$sources")"
          [[ -s "$legal_dir/player-source-manifest.json" && ! -L "$legal_dir/player-source-manifest.json" ]] || { echo "Windows player source manifest is missing" >&2; exit 1; }
          find "$sources" -type f -name '*.tar.gz' -print -quit | grep -q . || { echo "Windows source archive is missing" >&2; exit 1; }
          find "$sources" -type f -name '*.patch' -print -quit | grep -q . || { echo "Windows source patch is missing" >&2; exit 1; }
          tar -C "$legal_dir" -czf "$out/melearner-0.1.2-windows-sources.tar.gz" sources player-source-manifest.json
          (cd "$out" && sha256sum \
            melearner_0.1.2_amd64.AppImage \
            melearner-0.1.2-setup.exe \
            melearner-0.1.2-macos-arm64.dmg \
            melearner-bin-0.1.2-1-x86_64.pkg.tar.zst \
            melearner-0.1.2-windows-sources.tar.gz > SHA256SUMS)

      - name: Create or update draft release without overwriting assets
        if: ${{ !inputs.prepare_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.2
          if gh release view "$tag" --json isDraft,assets >.tmp/release-delivery/release.json 2>/dev/null; then
            [[ "$(jq -r .isDraft .tmp/release-delivery/release.json)" == true ]] || { echo "refusing to modify a published release" >&2; exit 1; }
            existing="$(jq -r '.assets[].name' .tmp/release-delivery/release.json)"
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              if grep -Fxq "$asset" <<<"$existing"; then
                echo "release already contains asset $asset; refusing overwrite" >&2
                exit 1
              fi
            done < <(find .tmp/release-delivery/out -maxdepth 1 -type f -printf '%f\n')
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title 'meLearner 0.1.2' \
              --notes $'* Staggered course and home transitions.\n* Matching rounded video and reading canvases.\n* Faster repeated HTML and Markdown opening.\n* Reliable replay from saved end positions.\n* PDF page text is available to accessibility tools.\n* Learning totals are readable by screen readers.\n* Automatic update notices, with saved preferences preserved.'
          fi
          gh release upload "$tag" \
            .tmp/release-delivery/out/melearner_0.1.2_amd64.AppImage \
            .tmp/release-delivery/out/melearner-bin-0.1.2-1-x86_64.pkg.tar.zst \
            .tmp/release-delivery/out/melearner-0.1.2-setup.exe \
            .tmp/release-delivery/out/melearner-0.1.2-macos-arm64.dmg \
            --repo "$GITHUB_REPOSITORY"

      - name: Retain build records and corresponding sources outside release downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: melearner-release-records
          path: |
            .tmp/release-delivery/out/*.sha256
            .tmp/release-delivery/out/SHA256SUMS
            .tmp/release-delivery/out/source-heads.json
            .tmp/release-delivery/out/*-sources.tar.gz
          if-no-files-found: error

      - name: Retain prepared installers for release review
        if: ${{ inputs.prepare_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: melearner-prepared-release
          path: .tmp/release-delivery/out/
          if-no-files-found: error
          retention-days: 1
