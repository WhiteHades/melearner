name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-appimage:
    name: native linux appimage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: install native package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libmpv-dev patchelf

      - name: require release inventory and notices
        run: |
          test -s packaging/runtime-lock.json
          test -s packaging/THIRD_PARTY_NOTICES
          test -s packaging/melearner.spdx.json

      - name: build native app
        working-directory: native-app
        run: |
          zig build test -Dplatform=null
          zig build package -Dplatform=linux -Doptimize=ReleaseSafe

      - name: fetch pinned package runtimes and tools
        run: |
          scripts/fetch-pdfium.sh linux-x64 .tmp/pdfium
          scripts/fetch-native-package-tools.sh linux-x64 .tmp/package-tools

      - name: assemble and audit appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/.tmp/package-tools/runtime-x86_64
        run: |
          set -euo pipefail
          export PATH="$PWD/.tmp/package-tools:$PATH"
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p dist/release
          scripts/package-native-linux.sh \
            --format appimage \
            --binary native-app/zig-out/bin/melearner \
            --resources native-app/zig-out/package/linux/resources \
            --pdfium .tmp/pdfium/lib/libpdfium.so \
            --output "dist/release/melearner_${version}_amd64.AppImage"
          sha256sum "dist/release/melearner_${version}_amd64.AppImage" \
            > "dist/release/melearner_${version}_amd64.AppImage.sha256"

      - name: sign appimage
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          test -n "$RELEASE_GPG_PASSPHRASE"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          for asset in dist/release/*.AppImage dist/release/*.sha256; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$RELEASE_GPG_PASSPHRASE" \
              --armor --detach-sign "$asset"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-appimage
          path: dist/release/
          if-no-files-found: error

  linux-arch:
    name: native linux arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: install workflow dependencies
        run: pacman -Syu --noconfirm git gtk4 libmpv patchelf sudo curl

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: require release inventory and notices
        run: |
          test -s packaging/runtime-lock.json
          test -s packaging/THIRD_PARTY_NOTICES
          test -s packaging/melearner.spdx.json

      - name: build native app and package resources
        working-directory: native-app
        run: |
          zig build test -Dplatform=null
          zig build package -Dplatform=linux -Doptimize=ReleaseSafe

      - name: stage audited native package
        run: |
          scripts/fetch-pdfium.sh linux-x64 .tmp/pdfium
          scripts/fetch-native-package-tools.sh linux-x64 .tmp/package-tools
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD/.tmp/package-tools:$PATH"
          scripts/package-native-linux.sh \
            --format arch-stage \
            --binary native-app/zig-out/bin/melearner \
            --resources native-app/zig-out/package/linux/resources \
            --pdfium .tmp/pdfium/lib/libpdfium.so \
            --output .tmp/arch-appdir
          scripts/audit-native-linux-package.sh .tmp/arch-appdir

      - name: build arch package
        run: |
          useradd -m builder
          cp -a packaging/arch .tmp/arch-build
          chown -R builder .tmp/arch-build .tmp/arch-appdir
          su builder -c "cd '$GITHUB_WORKSPACE/.tmp/arch-build' && MELEARNER_NATIVE_APPDIR='$GITHUB_WORKSPACE/.tmp/arch-appdir' makepkg -f --noconfirm"
          mkdir -p dist/release
          cp .tmp/arch-build/*.pkg.tar.zst dist/release/
          sha256sum dist/release/*.pkg.tar.zst > dist/release/arch-package.sha256

      - name: sign arch package
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          test -n "$RELEASE_GPG_PASSPHRASE"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          for asset in dist/release/*.pkg.tar.zst dist/release/*.sha256; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$RELEASE_GPG_PASSPHRASE" \
              --armor --detach-sign "$asset"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arch
          path: dist/release/
          if-no-files-found: error

  publish:
    name: publish verified native linux assets
    runs-on: ubuntu-24.04
    needs: [linux-appimage, linux-arch]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging

      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: dist/release
          merge-multiple: true

      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/runtime-lock.json packaging/THIRD_PARTY_NOTICES packaging/melearner.spdx.json dist/release/
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxf <(find dist/release -maxdepth 1 -type f -printf '%f\n'); then
            echo "refusing to replace an existing release asset" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" dist/release/* --repo "$GITHUB_REPOSITORY"
